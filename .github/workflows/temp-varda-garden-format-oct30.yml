name: Temporary garden formatter inspection
on:
  push:
    branches:
      - perf/garden-mobile-quality-oct30
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Show exact garden formatter changes
        run: |
          bunx oxfmt --write components/ThreeGarden.tsx tests/three-studio-render.test.ts
          git diff -- components/ThreeGarden.tsx tests/three-studio-render.test.ts
