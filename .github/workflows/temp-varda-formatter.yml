name: Temporary Varda formatter inspection
on:
  push:
    branches:
      - perf/pause-hidden-three-studio-oct30
permissions:
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Show Oxfmt output for touched files
        run: |
          bunx oxfmt --write components/ThreeStudioViewport.tsx tests/three-studio-render.test.ts
          git diff -- components/ThreeStudioViewport.tsx tests/three-studio-render.test.ts
