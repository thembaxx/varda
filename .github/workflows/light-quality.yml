name: Lightweight quality
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: varda-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-pass
          POSTGRES_DB: varda_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d varda_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VARDA_TEST_DATABASE_URL: postgresql://postgres:ci-only-pass@127.0.0.1:5432/varda_browser_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: varda-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
